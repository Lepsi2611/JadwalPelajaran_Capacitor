name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy web assets
        run: npm run web

      - name: Add Android platform (if missing)
        run: '[ -d android ] || npx cap add android'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p APK
          cp android/app/build/outputs/apk/debug/app-debug.apk APK/JadwalPelajaran.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JadwalPelajaran-apk
          path: APK/JadwalPelajaran.apk

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: APK/JadwalPelajaran.apk
