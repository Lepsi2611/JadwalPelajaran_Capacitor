<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<title>Jadwal Pelajaran</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="view-home" class="view active">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3V3zm3 0v15a1 1 0 0 0 1 1h8V6a1 1 0 0 0-1-1H8z"/></svg>
      </div>
      <h1>Jadwal Pelajaran</h1>
      <p id="subtitle">Pilih hari untuk melihat jadwal</p>
    </header>
    <main><ul id="day-list" class="day-list"></ul></main>
  </section>

  <section id="view-schedule" class="view">
    <header class="bar">
      <button id="btn-back" class="back" aria-label="Kembali ke halaman utama">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="title-day">Jadwal Hari</h2>
    </header>
    <nav id="tabs" class="tabs" aria-label="Pilih hari"></nav>
    <main>
      <div id="summary" class="summary"></div>
      <ol id="mapel-list" class="mapel-list"></ol>
      <div id="empty" class="empty" hidden>
        <svg viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
        <p>Belum ada jadwal untuk hari ini.</p>
      </div>
    </main>
  </section>

  <div id="error" class="error" hidden></div>
</div>
<script src="js/script.js"></script>
</body>
</html>
